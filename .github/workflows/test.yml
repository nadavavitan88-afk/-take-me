name: Travel planner tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend tests
        run: node --test tests/frontend.test.cjs
      - name: Lead API tests
        run: node --test tests/lead.test.cjs
      - name: AI planner tests
        run: node --test tests/plan.test.cjs
      - name: Search state tests
        run: node --test tests/search-state.test.cjs
