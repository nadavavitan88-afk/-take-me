
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>תודה שפניתם אלינו | TAKE ME</title>
  <style>
*{box-sizing:border-box}
html{background:#120f0c}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 20% 0%,rgba(214,173,99,.14),transparent 30%),linear-gradient(180deg,#17130f,#100d0a);color:#f7ead7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;text-align:center}
.card{width:min(540px,100%);padding:42px 28px;border:1px solid rgba(214,173,99,.24);border-radius:26px;background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.025));box-shadow:0 24px 70px rgba(0,0,0,.32)}
.logo{font-size:34px;font-weight:950;letter-spacing:.09em;color:#f5dfb3}.logo span{color:#d6ad63}
.check{font-size:48px;margin:24px 0 10px}
h1{font-size:30px;margin:10px 0 12px}
p{font-size:17px;line-height:1.8;color:#cdb99b}
a{display:inline-flex;align-items:center;justify-content:center;min-height:50px;margin-top:22px;padding:0 22px;border-radius:14px;background:linear-gradient(135deg,#d7ae62,#ba8841);color:#1c140d;text-decoration:none;font-weight:900}
</style>
</head>
<body>
  <main class="card">
    <div class="logo">TAKE <span>ME</span></div>
    <div class="check">✈️</div>
    <h1>הבקשה שלכם התקבלה בהצלחה!</h1>
    <p>
      תודה שבחרתם בנו לתכנון החופשה שלכם.<br>
      קיבלנו את הפרטים ונחזור אליכם בהקדם
      עם הצעה מותאמת אישית.
    </p>
    <a href="https://take-me-v7-full.vercel.app/">
      חזרה לאתר
    </a>
  </main>
</body>
</html>
