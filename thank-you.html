
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>תודה שפניתם אלינו | TAKE ME</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #141414;
      color: #f5eddd;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .card {
      width: 100%;
      max-width: 520px;
      padding: 48px 28px;
      border: 1px solid #8e7852;
      border-radius: 24px;
      background: #202020;
    }
    .logo {
      color: #d8b76b;
      font-size: 30px;
      font-weight: bold;
      letter-spacing: 3px;
    }
    .check { font-size: 52px; margin: 28px 0 12px; }
    h1 { font-size: 30px; }
    p { font-size: 18px; line-height: 1.8; color: #e0d7c7; }
    a {
      display: inline-block;
      margin-top: 24px;
      padding: 16px 32px;
      border-radius: 12px;
      background: #e9c35f;
      color: #171717;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">TAKE ME</div>
    <div class="check">✈️</div>
    <h1>הבקשה שלכם התקבלה בהצלחה!</h1>
    <p>
      תודה שבחרתם בנו לתכנון החופשה שלכם.<br>
      קיבלנו את הפרטים ונחזור אליכם בהקדם
      עם הצעה מותאמת אישית.
    </p>
    <a href="https://take-me-v7-full.vercel.app/">
      חזרה לאתר
    </a>
  </main>
</body>
</html>
